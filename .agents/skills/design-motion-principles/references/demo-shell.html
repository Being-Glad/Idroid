<!-- Demo Card Shell Template -->
<div class="demo-card demo-card-{n}">
  <div class="demo-card__header">
    <span class="demo-card__badge demo-card__badge--{severity}">{severity}</span>
    <span class="demo-card__title">{title}</span>
    <span class="demo-card__lens">Lens: {designer}</span>
  </div>
  <div class="demo-card__stage">
    <div class="demo-card-{n}__motion-target">
      {content}
    </div>
  </div>
  <div class="demo-card__footer">
    <code>{file}:{line}</code>
  </div>
</div>

<style>
/* Scoped Demo Card Styles */
.demo-card {
  border: 1px solid var(--border, #2a2a2e);
  border-radius: 12px;
  background: var(--bg-card, #161618);
  margin: 16px 0;
  overflow: hidden;
}

.demo-card__header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  background: var(--bg-header, rgba(255, 255, 255, 0.03));
  border-bottom: 1px solid var(--border, #2a2a2e);
  font-family: var(--sans, system-ui);
  font-size: 13px;
}

.demo-card__badge {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 9999px;
  text-transform: uppercase;
}

.demo-card__badge--critical { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
.demo-card__badge--important { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }

.demo-card__stage {
  min-height: 140px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: var(--bg-stage, #0f0f11);
}

.demo-card__footer {
  padding: 8px 16px;
  border-top: 1px solid var(--border, #2a2a2e);
  font-size: 11px;
  color: var(--text-dim, #888);
}
