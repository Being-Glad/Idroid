<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Idroid Ongoing Call</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      background: transparent !important;
      overflow: hidden;
      margin: 0;
      padding: 0;
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* === FULL EXPANDED CALL POPUP === */
    .call-card-container {
      width: 326px;
      background: rgba(14, 18, 27, 0.95);
      backdrop-filter: blur(36px) saturate(190%);
      -webkit-backdrop-filter: blur(36px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 20px;
      padding: 14px 16px 16px;
      box-shadow: 0 16px 42px rgba(0, 0, 0, 0.72), 0 0 0 1px rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    /* Top Drag Handle Header */
    .call-drag-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 16px;
      margin-bottom: 2px;
      -webkit-app-region: drag;
      cursor: grab;
    }
    .call-drag-bar:active {
      cursor: grabbing;
    }
    .drag-handle-pill {
      width: 36px;
      height: 4px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 9999px;
      margin-left: auto;
      margin-right: auto;
    }
    .btn-minimize-bubble {
      position: absolute;
      top: 10px;
      right: 12px;
      width: 24px;
      height: 24px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      transition: all 0.15s ease;
      -webkit-app-region: no-drag;
      z-index: 10;
    }
    .btn-minimize-bubble:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      transform: scale(1.08);
    }
    .btn-minimize-bubble:active {
      transform: scale(0.92);
    }

    /* Caller Info Header */
    .caller-header {
      display: flex;
      align-items: center;
      gap: 12px;
      -webkit-app-region: drag;
      cursor: grab;
    }
    .avatar-wrapper {
      position: relative;
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }
    .avatar-circle {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(135deg, #10b981 0%, #047857 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      font-weight: 700;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
    }
    .avatar-pulse {
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 2px solid rgba(16, 185, 129, 0.55);
      animation: pulse-ring 2s cubic-bezier(0.24, 0, 0.38, 1) infinite;
      pointer-events: none;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.9; }
      50% { transform: scale(1.18); opacity: 0; }
      100% { transform: scale(1.18); opacity: 0; }
    }

    .caller-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1;
    }
    .caller-name {
      font-size: 14.5px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.2px;
    }
    .caller-sub {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.8);
    }
    .timer-badge {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: #10b981;
      background: rgba(16, 185, 129, 0.12);
      padding: 1px 6px;
      border-radius: 6px;
      font-size: 11px;
    }

    /* 3-Way Audio Segmented Control */
    .route-segmented {
      display: flex;
      background: rgba(255, 255, 255, 0.06);
      padding: 3px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      gap: 3px;
      -webkit-app-region: no-drag;
    }
    .route-pill {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 6px 0;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      outline: none;
    }
    .route-pill:hover {
      color: #f1f5f9;
      background: rgba(255, 255, 255, 0.05);
    }
    .route-pill.active {
      background: #10b981;
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.35);
    }

    /* Audio Route Status Note */
    .route-status-note {
      font-size: 10.5px;
      color: #10b981;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.22);
      padding: 4px 8px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    /* Action Buttons Row */
    .call-actions-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 2px;
      -webkit-app-region: no-drag;
    }
    .btn-action-tool {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 38px;
      border-radius: 11px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.06);
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-action-tool:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      transform: translateY(-1px);
    }
    .btn-action-tool:active {
      transform: translateY(0);
    }
    .btn-action-tool.muted {
      background: rgba(239, 68, 68, 0.18);
      border-color: rgba(239, 68, 68, 0.4);
      color: #f87171;
    }
    .btn-action-end {
      width: 48px;
      height: 38px;
      background: #ef4444;
      border: none;
      border-radius: 11px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.45);
      transition: all 0.15s ease;
    }
    .btn-action-end:hover {
      background: #dc2626;
      transform: translateY(-1px) scale(1.04);
      box-shadow: 0 6px 18px rgba(239, 68, 68, 0.55);
    }
    .btn-action-end:active {
      transform: translateY(0) scale(0.96);
    }

    /* === ONE UI COMPACT BUBBLE / FLOATING PILL === */
    .call-bubble-container {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(14, 18, 27, 0.94);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 9999px;
      padding: 4px 12px 4px 5px;
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.65), 0 0 14px rgba(16, 185, 129, 0.22);
      -webkit-app-region: drag;
      cursor: grab;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .call-bubble-container:active {
      cursor: grabbing;
    }
    .call-bubble-container:hover {
      border-color: rgba(16, 185, 129, 0.7);
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.75), 0 0 20px rgba(16, 185, 129, 0.35);
    }
    .bubble-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #10b981 0%, #047857 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      position: relative;
    }
    .bubble-dot {
      position: absolute;
      top: 0;
      right: 0;
      width: 8px;
      height: 8px;
      background: #10b981;
      border: 1.5px solid #0e121b;
      border-radius: 50%;
    }
    .bubble-timer {
      font-size: 12.5px;
      font-weight: 700;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.3px;
    }
    .btn-bubble-expand {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 13px;
      padding: 2px 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: all 0.15s ease;
      -webkit-app-region: no-drag;
    }
    .btn-bubble-expand:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div id="call-root"></div>
  <script type="module" src="/src/call.ts"></script>
</body>
</html>
