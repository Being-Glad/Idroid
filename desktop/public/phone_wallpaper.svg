<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 640" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#141c2b"/>
      <stop offset="60%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#030509"/>
    </radialGradient>
    <radialGradient id="s23Sphere" cx="40%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#ffb86c"/>
      <stop offset="35%" stop-color="#ff6e32"/>
      <stop offset="70%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#2d1208"/>
    </radialGradient>
    <radialGradient id="s23CyanHalo" cx="65%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#030509" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crystalFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffb86c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="bloom">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="320" height="640" fill="url(#bgGlow)"/>
  <circle cx="160" cy="300" r="140" fill="url(#s23CyanHalo)"/>
  <circle cx="150" cy="280" r="110" fill="#ff6e32" opacity="0.18" filter="url(#bloom)"/>
  <circle cx="160" cy="290" r="82" fill="url(#s23Sphere)" filter="url(#bloom)"/>
  <circle cx="160" cy="290" r="82" fill="none" stroke="url(#crystalFacet)" stroke-width="2.5"/>
  <ellipse cx="140" cy="260" rx="42" ry="22" fill="#ffffff" opacity="0.22" transform="rotate(-25 140 260)"/>
  <polygon points="120,240 180,210 210,270 150,310" fill="url(#crystalFacet)" opacity="0.4"/>
  <polygon points="150,310 210,270 230,340 170,360" fill="url(#crystalFacet)" opacity="0.25"/>
  <circle cx="110" cy="210" r="2" fill="#ffb86c" opacity="0.8"/>
  <circle cx="215" cy="230" r="1.5" fill="#38bdf8" opacity="0.9"/>
  <circle cx="230" cy="360" r="2.5" fill="#ff6e32" opacity="0.7"/>
  <circle cx="95" cy="340" r="1.5" fill="#ffffff" opacity="0.8"/>
</svg>
